<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Global Energy - Edit Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="/account/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #121730;
            --card-bg: linear-gradient(135deg, #1a1f3a 0%, #151a35 100%);
            --accent-blue: #3b82f6;
            --accent-blue-light: #60a5fa;
            --accent-blue-dark: #2563eb;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
            --glow-blue: rgba(59, 130, 246, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(37, 99, 235, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(96, 165, 250, 0.08) 0%, transparent 50%);
            animation: backgroundShift 20s ease infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-20px, 20px) rotate(180deg); }
        }

        .appHeader {
            background: rgba(18, 23, 48, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .headerButton {
            color: var(--text-primary);
            font-size: 26px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
        }

        .headerButton:hover {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue-light);
            transform: translateX(-3px);
        }

        .pageTitle {
            font-size: 20px;
            font-weight: 700;
            flex-grow: 1;
            text-align: center;
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        #appCapsule {
            padding: 30px 20px;
            max-width: 550px;
            margin: 0 auto;
            min-height: calc(100vh - 60px);
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 24px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(59, 130, 246, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            animation: cardFadeIn 0.6s ease;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }

        .card-body {
            padding: 32px;
            position: relative;
        }

        h4 {
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 50%, #93c5fd 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            padding-bottom: 15px;
        }

        h4::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-blue), transparent);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
            animation: fadeInUp 0.5s ease backwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group label {
            font-size: 13px;
            color: var(--accent-blue-light);
            margin-bottom: 10px;
            display: block;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            background: rgba(30, 41, 59, 0.6) !important;
            border: 1.5px solid rgba(59, 130, 246, 0.3) !important;
            color: var(--text-primary) !important;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .form-control::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .form-control:focus {
            border-color: var(--accent-blue) !important;
            background: rgba(30, 41, 59, 0.8) !important;
            box-shadow: 
                0 0 0 4px rgba(59, 130, 246, 0.15),
                0 8px 16px rgba(59, 130, 246, 0.2);
            outline: none;
            transform: translateY(-2px);
        }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(59, 130, 246, 0.5), 
                transparent
            );
            margin: 30px 0;
            position: relative;
        }

        hr::after {
            content: '●';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent-blue);
            background: var(--bg-secondary);
            padding: 0 10px;
            font-size: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            padding: 16px;
            font-weight: 700;
            font-size: 16px;
            border-radius: 14px;
            margin-top: 15px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 8px 20px rgba(59, 130, 246, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 12px 28px rgba(59, 130, 246, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:active {
            transform: translateY(-1px);
            box-shadow: 
                0 6px 16px rgba(59, 130, 246, 0.4),
                inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .btn-primary.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .btn-primary.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success Toast Notification */
        #successToast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #00ffa6 0%, #00d98e 100%);
            color: #0a0e27;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 255, 166, 0.3);
            display: none;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 15px;
            z-index: 10000;
            animation: slideIn 0.4s ease;
            max-width: 400px;
        }

        #successToast.show {
            display: flex;
        }

        #successToast::before {
            content: '✓';
            font-size: 20px;
            font-weight: 700;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(400px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(400px);
            }
        }

        #successToast.hide {
            animation: slideOut 0.4s ease forwards;
        }

        @media (max-width: 576px) {
            #successToast {
                right: 10px;
                left: 10px;
                max-width: none;
            }
        }

        @media (max-width: 576px) {
            #appCapsule {
                padding: 20px 15px;
            }

            .card-body {
                padding: 24px 20px;
            }

            h4 {
                font-size: 22px;
            }

            .form-control {
                padding: 12px 16px;
            }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-blue), var(--accent-blue-dark));
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue-light);
        }
    </style>
</head>

<body>
    <!-- Success Toast Notification -->
    <div id="successToast">Profile updated successfully!</div>

    <div class="appHeader">
        <div class="left">
            <a href="/account" class="headerButton">
                <ion-icon name="chevron-back-outline"></ion-icon>
            </a>
        </div>
        <div class="pageTitle">Edit Account</div>
        <div class="right"></div>
    </div>

    <div id="appCapsule">
        <div class="card">
            <div class="card-body">
                <h4>Profile Settings</h4>
                <form id="editForm">
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" class="form-control" id="fullname" placeholder="John Doe">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    </div>

                    <hr>
                    
                    <h4 style="margin-top: 30px; margin-bottom: 20px; font-size: 18px;">💰 Wallet Addresses</h4>
                    
                    <div class="form-group">
                        <label for="btcAddress">🪙 Bitcoin (BTC) Address</label>
                        <input type="text" class="form-control" id="btcAddress" placeholder="1A1z7agoat...">
                    </div>
                    
                    <div class="form-group">
                        <label for="ethAddress">Ξ Ethereum (ETH) Address</label>
                        <input type="text" class="form-control" id="ethAddress" placeholder="0x742d35Cc6634C0532925a3b844Bc...">
                    </div>
                    
                    <div class="form-group">
                        <label for="usdtAddress">₮ Tether (USDT) Address</label>
                        <input type="text" class="form-control" id="usdtAddress" placeholder="0x742d35Cc6634C0532925a3b844Bc...">
                    </div>
                    
                    <div class="form-group">
                        <label for="bnbAddress">⬡ Binance Coin (BNB) Address</label>
                        <input type="text" class="form-control" id="bnbAddress" placeholder="0x742d35Cc6634C0532925a3b844Bc...">
                    </div>

                    <hr>
                    
                    <div class="form-group">
                        <label for="currentPassword">Current Password</label>
                        <input type="password" class="form-control" id="currentPassword" placeholder="••••••••">
                    </div>
                    
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" class="form-control" id="newPassword" placeholder="Leave blank to keep current">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/ionicons@5.0.0/dist/ionicons.js"></script>

    <script>
        async function loadProfile() {
            try {
                const res = await fetch('/dashboard/me', { credentials: 'include' });
                if (!res.ok) {
                    window.location.href = '/login';
                    return;
                }
                const data = await res.json();
                document.getElementById('fullname').value = data.fullname || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('btcAddress').value = data.btc_address || '';
                document.getElementById('ethAddress').value = data.eth_address || '';
                document.getElementById('usdtAddress').value = data.usdt_address || '';
                document.getElementById('bnbAddress').value = data.bnb_address || '';
            } catch (e) {
                console.error(e);
            }
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.classList.add('loading');
            submitBtn.textContent = '';
            
            const data = { 
                fullname: document.getElementById('fullname').value.trim(), 
                email: document.getElementById('email').value.trim(),
                btc_address: document.getElementById('btcAddress').value.trim(),
                eth_address: document.getElementById('ethAddress').value.trim(),
                usdt_address: document.getElementById('usdtAddress').value.trim(),
                bnb_address: document.getElementById('bnbAddress').value.trim()
            };
            const newPass = document.getElementById('newPassword').value;
            if (newPass) {
                data.current_password = document.getElementById('currentPassword').value;
                data.new_password = newPass;
            }

            try {
                const res = await fetch('/api/update-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                submitBtn.classList.remove('loading');
                submitBtn.textContent = 'Save Changes';
                
                if(res.ok) {
                    // Show success toast
                    const toast = document.getElementById('successToast');
                    toast.classList.add('show');
                    toast.classList.remove('hide');
                    
                    // Auto-hide after 3 seconds
                    setTimeout(() => {
                        toast.classList.add('hide');
                        setTimeout(() => {
                            toast.classList.remove('show', 'hide');
                        }, 400);
                    }, 3000);
                    
                    loadProfile();
                } else {
                    alert(result.error || 'Update failed');
                }
            } catch (e) {
                submitBtn.classList.remove('loading');
                submitBtn.textContent = 'Save Changes';
                alert('Connection error');
            }
        });

        loadProfile();
    </script>
</body>
</html>
